<!DOCTYPE html>
<html>
<head>
  <title>RUSH GATE</title>

  <!-- Gaming Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

  <!-- Howler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle, #050505, #000);
      font-family: 'Orbitron', sans-serif;
      color: #0ff;
      overflow: hidden;
    }

    /* MAIN CABINET */
    .cabinet {
      width: 55%;
      margin: auto;
      text-align: center;
      padding: 20px;
      position: relative;
      top: 35vh;
      transform: translateY(-35%);
    }

    h1 {
      font-size: 96px;
      margin: 10px 0;
      text-shadow: 0 0 60px #0ff;
      letter-spacing: 4px;
    }

    .status {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .connected { color: lime; }
    .disconnected { color: red; }

    .hud {
      display: flex;
      justify-content: space-between;
      font-size: 64px;
      margin: 30px 0;
    }

    .gate {
      margin: 40px auto;
      height: 180px;
      border: 6px solid #0ff;
      box-shadow: 0 0 70px #0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      letter-spacing: 3px;
    }

    .progress {
      height: 40px;
      border: 3px solid #fff;
      margin: 35px auto;
      width: 100%;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: lime;
    }

    .feedback {
      font-size: 60px;
      height: 80px;
      margin-top: 10px;
      text-shadow: 0 0 30px #0ff;
    }

    .rules {
      font-size: 20px;
      margin-top: 25px;
      color: #aaa;
      line-height: 1.6;
    }

    button {
      font-family: 'Orbitron';
      font-size: 36px;
      padding: 18px 50px;
      margin: 25px;
      background: transparent;
      color: #0ff;
      border: 3px solid #0ff;
      cursor: pointer;
      letter-spacing: 3px;
      box-shadow: 0 0 25px #0ff;
    }

    button:hover {
      background: #0ff;
      color: #000;
    }

    .real-world {
      position: fixed;
      bottom: 8px;
      width: 100%;
      text-align: center;
      font-size: 16px;
      color: #444;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>

<div class="cabinet">

  <h1>⚡ RUSH GATE ⚡</h1>

  <div class="status" id="status">
    🔴 <span class="disconnected">DISCONNECTED</span>
  </div>

  <div class="hud">
    <div id="score">SCORE: 0</div>
    <div id="time">TIME: 30</div>
  </div>

  <div class="gate" id="gate">TIMING STRIKE</div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="rules">
    🟢 Green Zone (0–2s): +10 Points<br>
    🔴 Red Zone (2–4s): −5 Points<br>
    ❌ Holding Car = No Score
  </div>

  <button onclick="connect()">CONNECT</button>
  <button onclick="startGame()">START</button>

</div>

<div class="real-world">
  ⬇ REAL WORLD PLAY AREA (IR SENSOR + CAR)
</div>

<script>
let score = 0;
let timeLeft = 30;
let cycleTime = 0;
let carPresent = false;
let gameRunning = false;

// Sounds
const goodSound = new Howl({ src: ['https://actions.google.com/sounds/v1/cartoon/pop.ogg'] });
const badSound = new Howl({ src: ['https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg'] });
const connectSound = new Howl({ src: ['https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg'] });
const gameOverSound = new Howl({ src: ['https://actions.google.com/sounds/v1/cartoon/descending_whistle_2.ogg'] });

function startGame() {
  score = 0;
  timeLeft = 30;
  cycleTime = 0;
  gameRunning = true;

  document.getElementById("score").innerText = "SCORE: 0";
  document.getElementById("feedback").innerText = "GO!";

  let timer = setInterval(() => {
    timeLeft--;
    document.getElementById("time").innerText = "TIME: " + timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      gameRunning = false;
      gameOverSound.play();

      document.getElementById("feedback").innerText = "GAME OVER!";

      gsap.to("#gate", { rotation: 6, yoyo: true, repeat: 6 });
      gsap.to("#score", { scale: 1.6, color: "lime", duration: 1 });
    }
  }, 1000);
}

// 4s Cycle Loop
setInterval(() => {
  if (!gameRunning) return;

  cycleTime = (cycleTime + 0.1) % 4;
  let percent = (cycleTime / 4) * 100;
  document.getElementById("bar").style.width = percent + "%";
  document.getElementById("bar").style.background =
    cycleTime < 2 ? "lime" : "red";
}, 100);

async function connect() {
  const port = await navigator.serial.requestPort();
  await port.open({ baudRate: 9600 });

  document.getElementById("status").innerHTML =
    "🟢 <span class='connected'>CONNECTED</span>";
  connectSound.play();

  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  const reader = decoder.readable.getReader();

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    if (!gameRunning) continue;

    if (value.trim() === "1" && !carPresent) {
      carPresent = true;

      if (cycleTime < 2) {
        score += 10;
        goodSound.play();
        document.getElementById("feedback").innerText = "+10 PERFECT!";
      } else {
        score -= 5;
        badSound.play();
        document.getElementById("feedback").innerText = "-5 TOO LATE!";
      }

      document.getElementById("score").innerText = "SCORE: " + score;
      gsap.fromTo("#score", { scale: 1 }, { scale: 1.3, yoyo: true, repeat: 1 });
    }

    if (value.trim() === "0") carPresent = false;
  }
}
</script>

</body>
</html>
